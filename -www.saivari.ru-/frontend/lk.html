<!DOCTYPE html>
<html lang="ru" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — Saivari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./css/reset.css?v=2">
  <link rel="stylesheet" href="./css/style.css?v=2">
  <link rel="stylesheet" href="./css/lk.css?v=2">
</head>

<body>

  <!-- Шапка сайта -->
  <div class="topbar">
    <div class="container--wide topbar__inner">
      <span class="topbar__text">Компьютерный мастер в Воронеже · Выезд на дом и в офис</span>
      <div class="topbar__socials">
        <a href="https://vk.com" target="_blank" rel="noopener noreferrer" class="social-link"
          aria-label="ВКонтакте">ВКонтакте</a>
        <a href="mailto:info@saivari.ru" class="social-link" aria-label="Gmail">info@saivari.ru</a>
      </div>
    </div>
  </div>

  <header class="header" role="banner">
    <div class="container--wide">
      <div class="header__inner">
        <a href="/" class="logo" aria-label="Saivari — на главную">
          <img src="./assets/images/logo.png" alt="" width="42" height="42" loading="eager">
          <span>Sai<span>vari</span></span>
        </a>
        <nav class="nav" role="navigation" aria-label="Главная навигация">
          <ul class="nav__links" role="list">
            <li><a href="/#services">Услуги</a></li>
            <li><a href="/#how">Как работаем</a></li>
            <li><a href="/#reviews">Отзывы</a></li>
            <li><a href="/#contact">Контакты</a></li>
          </ul>
          <!-- На странице ЛК кнопка показывает текущее состояние -->
          <a href="/login" class="btn btn--primary" aria-current="page">Личный кабинет</a>
          <button class="theme-toggle" data-theme-toggle aria-label="Переключить тему"></button>
        </nav>
      </div>
    </div>
  </header>

  <!-- Основной контент ЛК (всегда виден — защита через JS-редирект в lk.js) -->
  <main class="lk-page" id="lk-page">
    <div class="lk-container">
      <!-- Сайдбар -->
      <aside class="lk-sidebar">
        <div class="lk-user-info">
          <div class="lk-avatar" id="lk-avatar">?</div>
          <div class="lk-user-name" id="lk-username">Загрузка...</div>
          <div class="lk-user-email" id="lk-email"></div>
          <span class="lk-user-role">Клиент</span>
        </div>
        <nav>
          <ul class="lk-nav" role="list">
            <li class="lk-nav-item">
              <button class="active" onclick="showPanel('profile')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  aria-hidden="true">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
                Профиль
              </button>
            </li>
            <li class="lk-nav-item">
              <button onclick="showPanel('orders')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  aria-hidden="true">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                  <polyline points="14 2 14 8 20 8" />
                </svg>
                Мои заявки
              </button>
            </li>
            <li class="lk-nav-item">
              <button onclick="showPanel('reviews')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  aria-hidden="true">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>
                Мои отзывы
              </button>
            </li>
          </ul>
        </nav>
        <button class="lk-logout-btn" onclick="logout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          Выйти
        </button>
      </aside>

      <!-- Панели контента -->
      <div class="lk-content">

        <!-- Профиль -->
        <section class="lk-panel active" id="panel-profile" aria-label="Профиль">
          <h2 class="lk-panel-title">Мой профиль</h2>

          <form id="lk-profile-form" novalidate>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:var(--space-5); margin-bottom:var(--space-5)">
              <div class="form-group" style="margin-bottom:0">
                <label class="form-label" for="prof-name">Имя</label>
                <input class="form-input" id="prof-name" type="text" autocomplete="name">
              </div>
              <div class="form-group" style="margin-bottom:0">
                <label class="form-label" for="prof-email">Email</label>
                <input class="form-input" id="prof-email" type="email" autocomplete="email" readonly
                  style="opacity:0.6;cursor:not-allowed" title="Email изменить нельзя">
              </div>
              <div class="form-group" style="margin-bottom:0">
                <label class="form-label" for="prof-phone">Телефон</label>
                <input class="form-input" id="prof-phone" type="tel" placeholder="+7 (900) 000-00-00"
                  autocomplete="tel">
              </div>
              <div class="form-group" style="margin-bottom:0">
                <label class="form-label" for="prof-city">Город</label>
                <input class="form-input" id="prof-city" type="text" placeholder="Липецк">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="prof-comment">Комментарий для мастера
                <span style="font-weight:400;color:var(--color-text-faint)">(необязательно)</span>
              </label>
              <textarea class="form-textarea form-input" id="prof-comment" rows="3"
                placeholder="Например: удобно звонить после 18:00, домофон 45"></textarea>
            </div>

            <div
              style="border-top:1px solid var(--color-divider); padding-top:var(--space-5); margin-top:var(--space-2)">
              <h3 style="font-size:var(--text-sm);font-weight:700;color:var(--color-text);margin-bottom:var(--space-4)">
                Сменить пароль
              </h3>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:var(--space-5)">
                <div class="form-group" style="margin-bottom:0">
                  <label class="form-label" for="prof-pass-new">Новый пароль</label>
                  <input class="form-input" id="prof-pass-new" type="password" placeholder="Минимум 6 символов"
                    autocomplete="new-password">
                </div>
                <div class="form-group" style="margin-bottom:0">
                  <label class="form-label" for="prof-pass-confirm">Повторите пароль</label>
                  <input class="form-input" id="prof-pass-confirm" type="password" placeholder="••••••"
                    autocomplete="new-password">
                </div>
              </div>
            </div>

            <div style="margin-top:var(--space-6); display:flex; align-items:center; gap:var(--space-4)">
              <button type="submit" class="btn btn--primary">Сохранить изменения</button>
              <span id="prof-save-msg"
                style="font-size:var(--text-sm);color:var(--color-success,#2e7d32);display:none">✓ Сохранено</span>
            </div>
          </form>
        </section>

        <!-- Мои заявки -->
        <section class="lk-panel" id="panel-orders" aria-label="Мои заявки">
          <div
            style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-6);padding-bottom:var(--space-4);border-bottom:1px solid var(--color-divider)">
            <h2 style="font-family:var(--font-display);font-size:var(--text-lg);font-weight:800;letter-spacing:-0.02em">
              Мои заявки
            </h2>
            <button class="btn btn--primary" style="font-size:var(--text-sm)" onclick="showNewOrderModal()">
              + Новая заявка
            </button>
          </div>
          <div id="orders-list"></div>
        </section>

        <!-- Чат по заявке -->
        <section class="lk-panel" id="panel-chat" aria-label="Чат">
          <div class="chat-header">
            <button class="chat-back-btn" onclick="showPanel('orders')">← Назад</button>
            <h2 class="chat-title" id="chat-title">Чат по заявке</h2>
          </div>
          <div class="chat-messages" id="chat-messages" role="log" aria-live="polite"></div>
          <div class="chat-input-row">
            <input class="chat-input" id="chat-input" type="text" placeholder="Напишите сообщение..." maxlength="500">
            <button class="chat-send-btn" onclick="sendMessage()">Отправить</button>
          </div>
        </section>

        <!-- Мои отзывы -->
        <section class="lk-panel" id="panel-reviews" aria-label="Мои отзывы">
          <div
            style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-6);padding-bottom:var(--space-4);border-bottom:1px solid var(--color-divider)">
            <h2 style="font-family:var(--font-display);font-size:var(--text-lg);font-weight:800;letter-spacing:-0.02em">
              Мои отзывы
            </h2>
            <button class="btn btn--primary" style="font-size:var(--text-sm)" onclick="showNewReviewModal()">
              + Оставить отзыв
            </button>
          </div>
          <div id="reviews-list"></div>
        </section>
      </div><!-- /lk-content -->
    </div><!-- /lk-container -->
  </main>

  <div id="lk-toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Модалка новой заявки -->
  <div class="auth-overlay" id="new-order-modal" style="display:none" role="dialog" aria-modal="true"
    aria-labelledby="modal-order-title">
    <div class="auth-modal" style="max-width:520px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-6)">
        <h2 class="auth-modal-title" id="modal-order-title" style="margin-bottom:0">Новая заявка</h2>
        <button onclick="closeNewOrderModal()"
          style="background:none;border:none;font-size:var(--text-lg);cursor:pointer;color:var(--color-text-muted)"
          aria-label="Закрыть">✕</button>
      </div>
      <form id="lk-order-form" novalidate class="auth-form">
        <div class="form-group">
          <label class="form-label" for="lk-order-name">Ваше имя</label>
          <input class="form-input" id="lk-order-name" type="text" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="lk-order-contact">Телефон или Email</label>
          <input class="form-input" id="lk-order-contact" type="text" placeholder="+7 (900) 000-00-00 или email"
            required>
        </div>
        <div class="form-group">
          <label class="form-label" for="lk-order-service">Услуга</label>
          <select class="form-input" id="lk-order-service">
            <option value="">— Выберите услугу —</option>
            <option>Диагностика компьютера</option>
            <option>Настройка ПО и Windows</option>
            <option>Настройка интернета и Wi-Fi</option>
            <option>Переустановка Windows / Linux</option>
            <option>Настройка роутера</option>
            <option>Другое</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="lk-order-message">Описание проблемы</label>
          <textarea class="form-input" id="lk-order-message" rows="3"
            placeholder="Опишите проблему подробнее..."></textarea>
        </div>
        <button type="submit" class="btn btn--primary" style="width:100%;justify-content:center">Отправить
          заявку</button>
      </form>
    </div>
  </div>

  <!-- Модалка нового отзыва -->
  <div class="auth-overlay" id="new-review-modal" style="display:none" role="dialog" aria-modal="true"
    aria-labelledby="modal-review-title">
    <div class="auth-modal" style="max-width:480px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-6)">
        <h2 class="auth-modal-title" id="modal-review-title" style="margin-bottom:0">Оставить отзыв</h2>
        <button onclick="closeNewReviewModal()"
          style="background:none;border:none;font-size:var(--text-lg);cursor:pointer;color:var(--color-text-muted)"
          aria-label="Закрыть">✕</button>
      </div>
      <form id="lk-review-form" novalidate class="auth-form">
        <div class="form-group">
          <label class="form-label" for="lk-review-name">Ваше имя</label>
          <input class="form-input" id="lk-review-name" type="text" required>
        </div>
        <div class="form-group">
          <label class="form-label">Оценка</label>
          <div class="star-rating" id="lk-star-rating" role="radiogroup" aria-label="Выберите оценку">
            <span class="star" data-value="1" role="radio" aria-checked="false" tabindex="0"
              aria-label="1 звезда">★</span>
            <span class="star" data-value="2" role="radio" aria-checked="false" tabindex="0"
              aria-label="2 звезды">★</span>
            <span class="star" data-value="3" role="radio" aria-checked="false" tabindex="0"
              aria-label="3 звезды">★</span>
            <span class="star" data-value="4" role="radio" aria-checked="false" tabindex="0"
              aria-label="4 звезды">★</span>
            <span class="star" data-value="5" role="radio" aria-checked="false" tabindex="0"
              aria-label="5 звёзд">★</span>
          </div>
          <input type="hidden" id="lk-review-rating" value="0">
        </div>
        <div class="form-group">
          <label class="form-label" for="lk-review-text">Текст отзыва</label>
          <textarea class="form-input" id="lk-review-text" rows="4" required
            placeholder="Поделитесь впечатлениями о нашей работе..."></textarea>
        </div>
        <button type="submit" class="btn btn--primary" style="width:100%;justify-content:center">Отправить
          отзыв</button>
      </form>
    </div>
  </div>

  <script src="./js/main.js?v=2"></script>
  <script src="./js/lk.js?v=3"></script>

</body>

</html>
