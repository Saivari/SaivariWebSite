<!DOCTYPE html>
<html lang="ru" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход / Регистрация — Saivari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./css/reset.css?v=2">
  <link rel="stylesheet" href="./css/style.css?v=2">
  <link rel="stylesheet" href="./css/lk.css?v=2">
  <style>
    /* Страница входа */
    .login-page {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-8) var(--space-4);
      background: var(--color-bg);
    }

    .login-wrap {
      width: 100%;
      max-width: 440px;
    }

    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      margin-bottom: var(--space-8);
      text-decoration: none;
      color: var(--color-text);
      font-family: var(--font-display);
      font-weight: 800;
      font-size: var(--text-xl);
      letter-spacing: -0.02em;
    }

    .login-logo img {
      width: 40px;
      height: 40px;
    }

    .login-logo span span {
      color: var(--color-primary);
    }

    .login-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      box-shadow: var(--shadow-lg);
    }

    .login-title {
      font-family: var(--font-display);
      font-size: var(--text-xl);
      font-weight: 800;
      color: var(--color-text);
      margin-bottom: var(--space-6);
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .login-footer-link {
      text-align: center;
      margin-top: var(--space-5);
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }

    .login-footer-link a {
      color: var(--color-primary);
      font-weight: 600;
      text-decoration: none;
    }

    .login-footer-link a:hover {
      text-decoration: underline;
    }

    .auth-error {
      display: none;
      background: var(--color-error-highlight, #fce4ec);
      color: var(--color-error, #a12c7b);
      border: 1px solid var(--color-error, #a12c7b);
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4);
      font-size: var(--text-sm);
      font-weight: 500;
      line-height: 1.5;
    }

    .auth-success {
      display: none;
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #81c784;
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4);
      font-size: var(--text-sm);
      font-weight: 500;
      line-height: 1.5;
    }

    [data-theme="dark"] .auth-success {
      background: #0a2010;
      color: #66bb6a;
      border-color: #388e3c;
    }

    .form-eye-wrap {
      position: relative;
    }

    .form-eye-wrap .form-input {
      padding-right: 44px;
    }

    .form-eye-btn {
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
      width: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-text-faint);
      transition: color var(--transition-interactive);
    }

    .form-eye-btn:hover { color: var(--color-text-muted); }

    @media (max-width: 480px) {
      .login-card {
        padding: var(--space-6);
      }
    }
  </style>
</head>

<body>
  <main class="login-page">
    <div class="login-wrap">

      <!-- Логотип -->
      <a href="/" class="login-logo">
        <img src="./assets/images/logo.png" alt="" width="40" height="40" loading="eager">
        <span>Sai<span>vari</span></span>
      </a>

      <!-- Вход -->
      <div class="login-card" id="card-login">
        <h1 class="login-title">Добро пожаловать!</h1>

        <div class="auth-error" id="login-error" role="alert"></div>
        <div class="auth-success" id="login-success" role="status"></div>

        <form id="login-form" class="auth-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="login-email">Email</label>
            <input class="form-input" id="login-email" type="email" placeholder="you@example.com"
              autocomplete="email" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">Пароль</label>
            <div class="form-eye-wrap">
              <input class="form-input" id="login-password" type="password" placeholder="••••••"
                autocomplete="current-password" required>
              <button type="button" class="form-eye-btn" aria-label="Показать/скрыть пароль"
                onclick="togglePassword('login-password', this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn--primary" style="width:100%;justify-content:center;min-height:48px"
            id="login-btn">Войти</button>
        </form>

        <p class="login-footer-link">
          Ещё нет аккаунта?
          <a href="#" onclick="showCard('register');return false">Создать</a>
        </p>
      </div>

      <!-- Регистрация -->
      <div class="login-card" id="card-register" style="display:none">
        <h1 class="login-title">Создать аккаунт</h1>

        <div class="auth-error" id="reg-error" role="alert"></div>

        <form id="register-form" class="auth-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="reg-name">Имя</label>
            <input class="form-input" id="reg-name" type="text" placeholder="Иван Иванов"
              autocomplete="name" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-email">Email</label>
            <input class="form-input" id="reg-email" type="email" placeholder="you@example.com"
              autocomplete="email" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-phone">Телефон
              <span style="font-weight:400;color:var(--color-text-faint)">(необязательно)</span>
            </label>
            <input class="form-input" id="reg-phone" type="tel" placeholder="+7 (900) 000-00-00"
              autocomplete="tel">
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-password">Пароль</label>
            <div class="form-eye-wrap">
              <input class="form-input" id="reg-password" type="password" placeholder="Минимум 6 символов"
                autocomplete="new-password" required>
              <button type="button" class="form-eye-btn" aria-label="Показать/скрыть пароль"
                onclick="togglePassword('reg-password', this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn--primary" style="width:100%;justify-content:center;min-height:48px"
            id="reg-btn">Зарегистрироваться</button>
        </form>

        <p class="login-footer-link">
          Уже есть аккаунт?
          <a href="#" onclick="showCard('login');return false">Войти</a>
        </p>
      </div>

      <!-- Подтверждение email (показывается после регистрации) -->
      <div class="login-card" id="card-confirm" style="display:none">
        <div style="text-align:center;padding:var(--space-4) 0">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.5"
            style="margin:0 auto var(--space-5)" aria-hidden="true">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
            <polyline points="22,6 12,13 2,6" />
          </svg>
          <h2
            style="font-family:var(--font-display);font-size:var(--text-xl);font-weight:800;letter-spacing:-0.02em;margin-bottom:var(--space-3)">
            Проверьте email
          </h2>
          <p style="color:var(--color-text-muted);font-size:var(--text-sm);max-width:30ch;margin:0 auto">
            Мы отправили письмо на <strong id="confirm-email-shown"></strong>.
            Перейдите по ссылке из письма, чтобы активировать аккаунт.
          </p>
          <button onclick="showCard('login')"
            style="margin-top:var(--space-6);color:var(--color-primary);font-size:var(--text-sm);font-weight:600;background:none;border:none;cursor:pointer;text-decoration:underline">
            Вернуться на страницу входа
          </button>
        </div>
      </div>

    </div><!-- /login-wrap -->
  </main>

  <script src="./js/main.js?v=2"></script>
  <script src="./js/login.js?v=1"></script>
</body>

</html>
