<!DOCTYPE html>
<html lang="ru" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Saivari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./css/reset.css?v=2">
  <link rel="stylesheet" href="./css/style.css?v=2">
  <link rel="stylesheet" href="./css/lk.css?v=2">
  <style>
    /* ── Страница логина ── */
    .login-page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .login-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-8) var(--space-4);
      background: var(--color-bg);
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-10) var(--space-8);
      box-shadow: var(--shadow-lg);
    }

    .login-logo {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-8);
      text-decoration: none;
      color: var(--color-text);
    }

    .login-logo img {
      width: 36px;
      height: 36px;
    }

    .login-logo span {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .login-logo span span {
      color: var(--color-primary);
    }

    .login-title {
      font-family: var(--font-display);
      font-size: var(--text-xl);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--color-text);
      margin-bottom: var(--space-6);
    }

    /* Вкладки */
    .auth-tabs {
      display: flex;
      gap: 0;
      margin-bottom: var(--space-6);
      border-bottom: 2px solid var(--color-divider);
    }

    .auth-tab {
      background: none;
      border: none;
      padding: var(--space-2) var(--space-4) var(--space-3);
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--color-text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color var(--transition-interactive), border-color var(--transition-interactive);
    }

    .auth-tab.active {
      color: var(--color-primary);
      border-bottom-color: var(--color-primary);
    }

    /* Формы */
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    /* Сообщение об ошибке / успехе */
    .auth-message {
      display: none;
      margin-top: var(--space-3);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
    }

    .auth-message--error {
      background: #fce4ec;
      color: #c62828;
    }

    .auth-message--success {
      background: #e8f5e9;
      color: #2e7d32;
    }

    /* Нижние ссылки */
    .auth-hint {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      margin-top: var(--space-1);
      text-align: center;
    }

    .auth-hint a {
      color: var(--color-primary);
      text-decoration: none;
      cursor: pointer;
      font-weight: 500;
    }

    .auth-hint a:hover {
      text-decoration: underline;
    }

    .login-back {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      text-decoration: none;
      margin-top: var(--space-5);
    }

    .login-back:hover {
      color: var(--color-text);
    }

    /* Тема-тоггл в углу */
    .login-theme-wrap {
      position: fixed;
      top: var(--space-4);
      right: var(--space-4);
      z-index: 100;
    }

    .theme-toggle {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--color-text-muted);
      transition: background var(--transition-interactive), color var(--transition-interactive);
    }

    .theme-toggle:hover {
      background: var(--color-surface-offset);
      color: var(--color-text);
    }

    @media (max-width: 480px) {
      .login-card {
        padding: var(--space-6) var(--space-5);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
      }
    }
  </style>
</head>

<body class="login-page">

  <!-- Переключатель темы -->
  <div class="login-theme-wrap">
    <button class="theme-toggle" data-theme-toggle aria-label="Переключить тему"></button>
  </div>

  <main class="login-main">
    <div class="login-card">

      <!-- Логотип -->
      <a href="/" class="login-logo" aria-label="Saivari — на главную">
        <img src="./assets/images/logo.png" alt="" width="36" height="36" loading="eager">
        <span>Sai<span>vari</span></span>
      </a>

      <h1 class="login-title" id="auth-title">Войдите в аккаунт</h1>

      <!-- Вкладки -->
      <div class="auth-tabs" role="tablist">
        <button class="auth-tab active" id="tab-login" role="tab" aria-selected="true"
          onclick="switchTab('login')">Вход</button>
        <button class="auth-tab" id="tab-register" role="tab" aria-selected="false"
          onclick="switchTab('register')">Регистрация</button>
      </div>

      <!-- ── Форма входа ── -->
      <form class="auth-form" id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-email">Email</label>
          <input class="form-input" id="login-email" type="email" placeholder="your@email.ru" required
            autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Пароль</label>
          <input class="form-input" id="login-password" type="password" placeholder="••••••" required
            autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn--primary" style="width:100%;justify-content:center">Войти</button>
        <p class="auth-hint">
          <a href="#" onclick="forgotPassword(); return false;">Забыли пароль?</a>
        </p>
        <p class="auth-hint">Нет аккаунта?
          <a onclick="switchTab('register')">Зарегистрируйтесь</a>
        </p>
      </form>

      <!-- ── Форма регистрации ── -->
      <form class="auth-form" id="register-form" novalidate style="display:none">
        <div class="form-group">
          <label class="form-label" for="reg-name">Ваше имя</label>
          <input class="form-input" id="reg-name" type="text" placeholder="Иван Иванов" required
            autocomplete="name">
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-email">Email</label>
          <input class="form-input" id="reg-email" type="email" placeholder="your@email.ru" required
            autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-phone">Телефон
            <span style="font-weight:400;color:var(--color-text-faint)">(необязательно)</span>
          </label>
          <input class="form-input" id="reg-phone" type="tel" placeholder="+7 (900) 000-00-00"
            autocomplete="tel">
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password">Пароль</label>
          <input class="form-input" id="reg-password" type="password" placeholder="Минимум 6 символов" required
            autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn--primary"
          style="width:100%;justify-content:center">Создать аккаунт</button>
        <p class="auth-hint">Уже есть аккаунт?
          <a onclick="switchTab('login')">Войдите</a>
        </p>
      </form>

      <!-- Сообщение об ошибке / успехе -->
      <div id="auth-message" class="auth-message"></div>

      <!-- Назад на главную -->
      <a href="/" class="login-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          aria-hidden="true">
          <path d="M19 12H5M12 5l-7 7 7 7" />
        </svg>
        Вернуться на главную
      </a>

    </div>
  </main>

  <script>
    /* ============================================================
       AUTH.JS (встроен) — логика страницы логина
       ============================================================ */

    const API = '';

    // ── Тема ────────────────────────────────────────────────────
    (function initTheme() {
      const toggle = document.querySelector('[data-theme-toggle]');
      const root = document.documentElement;
      let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      root.setAttribute('data-theme', theme);
      updateIcon(theme);
      if (toggle) {
        toggle.addEventListener('click', () => {
          theme = theme === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', theme);
          updateIcon(theme);
        });
      }
      function updateIcon(t) {
        if (!toggle) return;
        toggle.innerHTML = t === 'dark'
          ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`
          : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
      }
    })();

    // ── Если уже авторизован — редиректим сразу в ЛК ────────────
    (function checkAlreadyLoggedIn() {
      const token = localStorage.getItem('lk_token');
      if (!token) return;
      fetch(`${API}/api/auth/me`, {
        headers: { 'Authorization': `Bearer ${token}` }
      }).then(r => {
        if (r.ok) window.location.replace('/lk.html');
      }).catch(() => { });
    })();

    // ── Утилиты ─────────────────────────────────────────────────
    function el(id) { return document.getElementById(id); }

    function showMessage(msg, type = 'error') {
      const box = el('auth-message');
      box.textContent = msg;
      box.className = `auth-message auth-message--${type}`;
      box.style.display = 'block';
    }

    function clearMessage() {
      const box = el('auth-message');
      box.style.display = 'none';
    }

    // ── Переключение вкладок ─────────────────────────────────────
    function switchTab(tab) {
      const isLogin = tab === 'login';
      el('login-form').style.display = isLogin ? 'flex' : 'none';
      el('register-form').style.display = isLogin ? 'none' : 'flex';
      el('tab-login').classList.toggle('active', isLogin);
      el('tab-register').classList.toggle('active', !isLogin);
      el('tab-login').setAttribute('aria-selected', String(isLogin));
      el('tab-register').setAttribute('aria-selected', String(!isLogin));
      el('auth-title').textContent = isLogin ? 'Войдите в аккаунт' : 'Создайте аккаунт';
      clearMessage();
    }

    // ── Маска телефона ───────────────────────────────────────────
    function formatPhoneMask(value) {
      let digits = String(value || '').replace(/\D/g, '');
      if (!digits) return '';
      if (digits.startsWith('8')) digits = '7' + digits.slice(1);
      else if (digits.startsWith('9')) digits = '7' + digits;
      else if (!digits.startsWith('7')) digits = '7' + digits;
      digits = digits.slice(0, 11);
      let result = '+7';
      if (digits.length > 1) result += ' (' + digits.slice(1, 4);
      if (digits.length >= 5) result += ') ' + digits.slice(4, 7);
      if (digits.length >= 8) result += '-' + digits.slice(7, 9);
      if (digits.length >= 10) result += '-' + digits.slice(9, 11);
      return result;
    }

    const regPhone = el('reg-phone');
    if (regPhone) {
      regPhone.addEventListener('focus', () => {
        if (!regPhone.value.trim()) regPhone.value = '+7';
      });
      regPhone.addEventListener('input', () => {
        regPhone.value = formatPhoneMask(regPhone.value);
      });
      regPhone.addEventListener('blur', () => {
        if (regPhone.value === '+7') regPhone.value = '';
      });
    }

    // ── Вход ─────────────────────────────────────────────────────
    el('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      clearMessage();

      const email = el('login-email').value.trim();
      const password = el('login-password').value;
      const btn = e.target.querySelector('button[type="submit"]');
      const origText = btn.textContent;

      btn.disabled = true;
      btn.textContent = 'Входим...';

      try {
        const r = await fetch(`${API}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await r.json();
        if (!r.ok) return showMessage(data.error || 'Ошибка входа');

        localStorage.setItem('lk_token', data.token);

        // Редиректим в ЛК
        window.location.replace('/lk.html');
      } catch {
        showMessage('Ошибка соединения с сервером');
      } finally {
        btn.disabled = false;
        btn.textContent = origText;
      }
    });

    // ── Регистрация ───────────────────────────────────────────────
    el('register-form').addEventListener('submit', async e => {
      e.preventDefault();
      clearMessage();

      const name = el('reg-name').value.trim();
      const email = el('reg-email').value.trim();
      const phone = el('reg-phone').value.trim();
      const password = el('reg-password').value;

      if (!name || !/^[а-яёА-ЯЁa-zA-Z][а-яёА-ЯЁa-zA-Z\s\-]{1,49}$/.test(name))
        return showMessage('Имя должно содержать только буквы (минимум 2 символа)');
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))
        return showMessage('Введите корректный email');
      if (password.length < 6)
        return showMessage('Пароль минимум 6 символов');
      if (phone && !/^(\+7|8)[\s\-]?\(?\d{3}\)?[\s\-]?\d{3}[\s\-]?\d{2}[\s\-]?\d{2}$/.test(phone))
        return showMessage('Введите корректный номер телефона или оставьте поле пустым');

      const btn = e.target.querySelector('button[type="submit"]');
      const origText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Создаём аккаунт...';

      try {
        const r = await fetch(`${API}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone, password }),
        });
        const data = await r.json();
        if (!r.ok) return showMessage(data.error || 'Ошибка регистрации');

        // После регистрации — переходим на вход с prefill email
        e.target.reset();
        switchTab('login');
        el('login-email').value = email;
        showMessage('Регистрация почти завершена. Проверьте email и подтвердите адрес.', 'success');
      } catch {
        showMessage('Ошибка соединения с сервером');
      } finally {
        btn.disabled = false;
        btn.textContent = origText;
      }
    });

    // ── Забыли пароль ─────────────────────────────────────────────
    async function forgotPassword() {
      const email = el('login-email').value.trim();
      if (!email) {
        showMessage('Введите email в поле выше, затем нажмите «Забыли пароль?»');
        return;
      }
      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        showMessage(data.message || data.error, res.ok ? 'success' : 'error');
      } catch {
        showMessage('Ошибка сети. Попробуйте позже.');
      }
    }
  </script>

</body>

</html>
