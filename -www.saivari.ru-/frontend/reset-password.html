<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля — СайВари</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            background: #fff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            color: #01696f;
            margin-bottom: 24px;
            font-size: 22px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            margin-bottom: 16px;
        }

        input:focus {
            outline: none;
            border-color: #01696f;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #01696f;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0c4e54;
        }

        .msg {
            margin-top: 16px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }

        .msg.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .msg.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Новый пароль</h1>
        <div id="form-section">
            <label for="password">Введите новый пароль</label>
            <input type="password" id="password" placeholder="Минимум 6 символов">
            <label for="password2">Повторите пароль</label>
            <input type="password" id="password2" placeholder="Повторите пароль">
            <button onclick="resetPassword()">Сохранить пароль</button>
        </div>
        <div id="msg" class="msg"></div>
    </div>

    <script>
        const token = new URLSearchParams(window.location.search).get('token');
        if (!token) {
            document.getElementById('form-section').style.display = 'none';
            const msg = document.getElementById('msg');
            msg.className = 'msg error';
            msg.textContent = 'Ссылка недействительна. Запросите сброс пароля повторно.';
        }

        async function resetPassword() {
            const password = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;
            const msg = document.getElementById('msg');

            msg.className = 'msg';
            msg.textContent = '';

            if (password.length < 6) {
                msg.className = 'msg error';
                msg.textContent = 'Пароль должен быть минимум 6 символов.';
                return;
            }
            if (password !== password2) {
                msg.className = 'msg error';
                msg.textContent = 'Пароли не совпадают.';
                return;
            }

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password }),
                });
                const data = await res.json();

                if (res.ok) {
                    document.getElementById('form-section').style.display = 'none';
                    msg.className = 'msg success';
                    msg.textContent = data.message + ' Перейдите на страницу входа.';
                } else {
                    msg.className = 'msg error';
                    msg.textContent = data.error || 'Ошибка. Попробуйте снова.';
                }
            } catch {
                msg.className = 'msg error';
                msg.textContent = 'Ошибка сети. Попробуйте позже.';
            }
        }
    </script>
</body>

</html>
